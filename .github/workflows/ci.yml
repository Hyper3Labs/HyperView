name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      # ruff and pytest are declared in the `dev` extra, which uv does not
      # install by default; without it both steps fail to spawn their tool.
      - name: Lint
        run: uv run --extra dev ruff check src tests examples

      # The static-export tests load the packaged bundle and drive frontend
      # modules through node, so this job needs the same frontend build that
      # release.yml packages -- not just the separate Frontend job's copy.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for packaging tests
        run: |
          cd frontend
          npm ci
          npm run build
          rm -rf ../src/hyperview/server/static
          mkdir -p ../src/hyperview/server/static
          cp -r out/* ../src/hyperview/server/static/

      - name: Test
        run: uv run --extra dev pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
